name: Introibo
options:
  bundleIdPrefix: app.introibo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.5.7"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Introibo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - target: IntroiboWidgets
        embed: true
    entitlements:
      path: Introibo/Introibo.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.introibo.shared
    sources:
      - path: Introibo
        excludes:
          - "Info.plist"
    info:
      path: Introibo/Info.plist
      properties:
        CFBundleDisplayName: Introibo
        CFBundleName: $(PRODUCT_NAME)
        CFBundleIconName: AppIcon
        LSRequiresIPhoneOS: true
        CFBundleURLTypes:
          - CFBundleURLName: app.introibo.Introibo.link
            CFBundleURLSchemes:
              - introibo
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.introibo.Introibo
        PRODUCT_NAME: Introibo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        CODE_SIGN_STYLE: Automatic

  IntroiboWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    entitlements:
      path: IntroiboWidgets/IntroiboWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.app.introibo.shared
    sources:
      - path: IntroiboWidgets
      # Shared logic: the widget compiles the SAME files the app uses, so the
      # two can never disagree about the current hour or the widget config.
      - path: Introibo/Liturgical/OfficeSchedule.swift
      - path: Introibo/Widget/WidgetConfigStore.swift
      # Same bundled schedule data the app reads.
      - path: Introibo/Resources/hours.json
        buildPhase: resources
    info:
      path: IntroiboWidgets/Info.plist
      properties:
        CFBundleDisplayName: Introibo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.introibo.Introibo.widgets
        PRODUCT_NAME: IntroiboWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
