name: Android Build & Test

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # android/ has no gradle wrapper committed; use the setup-gradle binary.
      - name: Compile (debug)
        working-directory: android
        run: gradle :app:compileDebugKotlin --no-daemon

      - name: Unit tests
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Assemble release AAB (unsigned)
        working-directory: android
        run: gradle :app:bundleRelease --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/app/build/reports/tests/
